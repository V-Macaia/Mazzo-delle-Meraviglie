<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mazzo delle Meraviglie</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" href="immagini/icona.png">

</head>

<body>

<header>

    <h1> Mazzo delle Meraviglie</h1>

    <p>Gestore digitale del Mazzo delle Meraviglie per D&D 5e</p>

</header>


<main>

    <section id="campagna">

        <h2>Campagna</h2>

        <select id="listaCampagne"></select>

        <button id="nuovaCampagna">
            Nuova
        </button>

        <button id="eliminaCampagna">
            Elimina
        </button>

    </section>



    <section id="carta">

        <img
            id="immagineCarta"
            src="immagini/retro.png"
            alt="Carta">

        <h2 id="nomeCarta">
            Nessuna carta pescata
        </h2>

        <p id="descrizioneCarta">
            Premi "Pesca" per estrarre una carta.
        </p>

    </section>



    <section id="azioni">

    <button id="pesca">
        Pesca
    </button>


    </section>



    <section id="accessoMaster">

      <h2> Area Master </h2>  

      <input
      type="password"
      id="passwordMaster"
      placeholder="Password Master">

      <button id="entraMaster">
      Entra
      </button>

     <p id="errorePassword"></p>

    </section>




   <section id="master" style="display:none">

    <h2> Modalità Master</h2>

    <div class="master-riga">

         <input
            type="text"
            id="inputCarta"
            placeholder="Nome della carta">

         <button id="reinserisci">
           Reinserisci
         </button>

         <button id="rimuoviCarta">
          Rimuovi carta
         </button>

         </div>

           <button id="resetMazzo">
             Resetta il mazzo
           </button>

            <button id="esciMaster">
             Esci modalità Master
            </button>

        </section>



    <section id="cronologia">

        <h2>Carte pescate</h2>

        <ul id="listaPescate"></ul>

    </section>

</main>



<footer>

    Mazzo delle Meraviglie • Versione 3.0

</footer>



<script src="deck.js"></script>

<script type="module" src="app.js"></script>


</body>

</html>
